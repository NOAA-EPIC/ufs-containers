packages:
  all:
    target: [x86_64_v3]
  autoconf:
    externals:
    - spec: autoconf@2.71
      prefix: /usr
  automake:
    externals:
    - spec: automake@1.16.5
      prefix: /usr
  binutils:
    externals:
    - spec: binutils@2.42+gold~headers
      prefix: /usr
  coreutils:
    externals:
    - spec: coreutils@9.4
      prefix: /usr
  diffutils:
    externals:
    - spec: diffutils@3.10
      prefix: /usr
  findutils:
    externals:
    - spec: findutils@4.9.0
      prefix: /usr
  flex:
    externals:
    - spec: flex@2.6.4+lex
      prefix: /usr
  gawk:
    externals:
    - spec: gawk@5.2.1
      prefix: /usr
  git:
    externals:
    - spec: git@2.43.0~tcltk
      prefix: /usr
  git-lfs:
    externals:
    - spec: git-lfs@3.4.1
      prefix: /usr
  grep:
    externals:
    - spec: grep@3.11
      prefix: /usr
  groff:
    externals:
    - spec: groff@1.23.0
      prefix: /usr
  m4:
    externals:
    - spec: m4@1.4.19
      prefix: /usr
  perl:
    externals:
    - spec: perl@5.38.2~cpanm+opcode+open+shared+threads
      prefix: /usr
  pkgconf:
    externals:
    - spec: pkgconf@1.8.1
      prefix: /usr
  qt::
    buildable: false
    externals:
    - spec: qt@5.15.3
      prefix: /usr
    version: [5.15.3]
  sed:
    externals:
    - spec: sed@4.9
      prefix: /usr
  tar:
    externals:
    - spec: tar@1.35
  wget::
    buildable: false
    externals:
    - spec: wget@1.21.4
      prefix: /usr
